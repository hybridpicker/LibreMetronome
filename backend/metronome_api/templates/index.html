{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibreMetronome</title>
    <meta name="theme-color" content="#0072b2">
    <link rel="icon" href="/assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/fav/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/fav/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/fav/apple-touch-icon-152x152.png">
    <link rel="manifest" href="/assets/manifest.json">
    {# ?v= busts the long nginx cache (JS 7 days, CSS 30 days); raise it with every release. #}
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v=0.8.0">
</head>
<body>
    <div id="root"></div>
    <script src="{% static 'js/main.js' %}?v=0.8.0"></script>
</body>
</html>
