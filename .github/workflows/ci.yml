name: CI

# Quality gates only. This workflow never deploys, never reads secrets and
# only runs for pull requests (and on demand).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key
      DJANGO_SETTINGS_MODULE: libremetronome_backend.test_settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Lint and format
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        working-directory: backend
        run: mypy .
      - name: Security lint
        working-directory: backend
        run: bandit -c pyproject.toml -q -r .
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Tests with coverage gate
        working-directory: backend
        run: |
          coverage run manage.py test
          coverage report --fail-under=100

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests with coverage gate
        run: npm run coverage
      - name: Dependency audit (shipped code)
        run: npm audit --omit=dev
      - name: Production build
        run: npm run build
